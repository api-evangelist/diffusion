aid: diffusion
name: Diffusion
description: >-
  Diffusion Software is a small independent software vendor that develops
  audio-encoding and RDS (Radio Data System) tooling for FM radio broadcasters.
  Its flagship product, Airomate, is a software-based RDS/RBDS encoder that
  generates a high-quality RDS signal using a 192 kHz-capable soundcard, letting
  stations broadcast professional-looking RDS information (station name,
  RadioText, program service data) at low cost without dedicated hardware. The
  company also ships complementary broadcast utilities: StereoCoder (an FM
  stereo/MPX encoder), Little SineGen (a sine-wave generator that runs at any
  sample rate the soundcard supports), and Chronos (a free scheduler that
  sequences Programme Service name and RadioText messages for Airomate). The
  products are Windows desktop applications distributed as low-cost licensed
  downloads. Diffusion Software is a seed-stage Canaan Partners portfolio company
  and does not publish a public API, SDK, or developer portal; this profile is
  maintained as a network identity record.
